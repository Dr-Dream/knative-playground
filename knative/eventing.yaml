apiVersion: operator.knative.dev/v1beta1
kind: KnativeEventing
metadata:
  name: knative-eventing
  namespace: knative-eventing
spec:
  additionalManifests:
    - URL: https://github.com/knative-extensions/eventing-kafka-broker/releases/download/knative-v1.22.1/eventing-kafka-controller.yaml
    - URL: https://github.com/knative-extensions/eventing-kafka-broker/releases/download/knative-v1.22.1/eventing-kafka-broker.yaml
    - URL: https://github.com/knative-extensions/eventing-kafka-broker/releases/download/knative-v1.22.1/eventing-kafka-channel.yaml
  config:
    features:
      cross-namespace-event-links: "enabled"
    observability:
      metrics-protocol: grpc
      metrics-endpoint: http://otel-telemetry-collector.observability.svc.cluster.local:4317/v1/metrics
      metrics-export-interval: 60s
      tracing-protocol: grpc
      tracing-endpoint: http://otel-telemetry-collector.observability.svc.cluster.local:4317/v1/traces
      tracing-sampling-rate: "1"
    config-br-default-channel:
      channel-template-spec: |
        apiVersion: messaging.knative.dev/v1beta1
        kind: KafkaChannel
        spec:
          numPartitions: 10
          replicationFactor: 1
    default-ch-webhook:
      default-ch-config: |
        clusterDefault:
          apiVersion: messaging.knative.dev/v1beta1
          kind: KafkaChannel
          spec:
            numPartitions: 10
            replicationFactor: 1
    config-br-defaults:
      default-broker-class: Kafka
    kafka-broker-config:
      bootstrap.servers: "knative-kafka-bootstrap.kafka.svc.cluster.local:9092"
    kafka-channel-config:
      bootstrap.servers: "knative-kafka-bootstrap.kafka.svc.cluster.local:9092"
