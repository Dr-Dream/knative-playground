datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        url: http://prometheus-server
        isDefault: true
        jsonData:
          httpMethod: POST

          # metrics -> traces.
          exemplarTraceIdDestinations:
            - name: traceID
              datasourceUid: tempo
              urlDisplayLabel: 'Open trace'

      - name: Loki
        uid: loki
        type: loki
        url: http://loki-gateway
        jsonData:
          # logs -> traces
          derivedFields:
            - name: TraceID
              datasourceUid: tempo
              matcherType: label
              matcherRegex: 'trace_id'
              url: '$${__value.raw}'
              urlDisplayLabel: 'Open trace'

            - name: TraceIDInText
              datasourceUid: tempo
              matcherType: regex
              matcherRegex: '(?:trace[_-]?id|traceID|traceId)["=:\s]+([0-9a-f]{32})'
              url: '$${__value.raw}'
              urlDisplayLabel: 'Open trace'

      - name: Tempo
        uid: tempo
        type: tempo
        url: http://tempo:3200
        jsonData:
          httpMethod: GET

          streamingEnabled:
            search: true
            metrics: true

          nodeGraph:
            enabled: true

          serviceMap:
            datasourceUid: prometheus

          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: '-2m'
            spanEndTimeShift: '2m'
            filterByTraceID: true
            filterBySpanID: true
            tags:
              - key: 'k8s.pod.name'
                value: 'k8s_pod_name'
              - key: 'k8s.namespace.name'
                value: 'k8s_namespace_name'

          tracesToMetrics:
            datasourceUid: prometheus
            spanStartTimeShift: '-2m'
            spanEndTimeShift: '2m'
            tags:
              - key: 'service.name'
                value: 'service'
            queries:
              - name: 'Request rate'
                query: 'sum by (span_name) (rate(traces_spanmetrics_calls_total{$$__tags}[$$__rate_interval]))'
              - name: 'Error rate'
                query: 'sum by (span_name) (rate(traces_spanmetrics_calls_total{$$__tags, status_code="STATUS_CODE_ERROR"}[$$__rate_interval]))'
              - name: 'Latency p95'
                query: 'histogram_quantile(0.95, sum by (le, span_name) (rate(traces_spanmetrics_latency_bucket{$$__tags}[$$__rate_interval])))'

          spanBar:
            type: 'Duration'
          traceQuery:
            timeShiftEnabled: true
            spanStartTimeShift: '-2m'
            spanEndTimeShift: '2m'
