loki:
  auth_enabled: false
  deploymentMode: Monolithic
  storage:
    type: filesystem
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    delete_request_store: filesystem
    compaction_interval: 10m
    retention_delete_delay: 1h
    retention_delete_worker_count: 150

  limits_config:
    allow_structured_metadata: true
    retention_period: 168h
    retention_stream:
      - selector: '{k8s_container_name="istio-proxy"}'
        priority: 1
        period: 24h
    ingestion_rate_mb: 8
    ingestion_burst_size_mb: 16
    per_stream_rate_limit: 3MB
    per_stream_rate_limit_burst: 10MB
    max_global_streams_per_user: 5000

  distributor:
    otlp_config:
      default_resource_attributes_as_index_labels:
        - service.name
        - service.namespace
        - k8s.namespace.name
        - k8s.container.name
        - k8s.pod.name
singleBinary:
  replicas: 1
minio:
  enabled: false
auth_enabled: false
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

lokiCanary:
  enabled: false
test:
  enabled: false
